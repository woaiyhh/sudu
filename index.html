<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Edge文本朗读器</title>

<style>

html,body{
    margin:0;
    padding:0;
    height:100%;
}

body{
    display:flex;
    flex-direction:column;
}

textarea{
    flex:1;
    width:100%;
    resize:none;
    border:none;
    outline:none;
    padding:15px;
    box-sizing:border-box;
    font-size:18px;
    line-height:1.8;
}

.controls{
    display:flex;
    flex-wrap:wrap;
    background:#f5f5f5;
    padding:5px;
}

button,
select{

    height:45px;
    font-size:16px;
    margin:3px;

}

button{

    flex:1;
    min-width:80px;

}

#status{

    text-align:center;
    height:30px;
    line-height:30px;
    font-size:14px;
    color:#666;

}

</style>

</head>


<body>


<textarea id="editor"
placeholder="请输入需要朗读的文字"></textarea>


<div id="status">
准备就绪
</div>


<div class="controls">

<button onclick="speakText()">
朗读
</button>

<button onclick="pauseResume()">
暂停/继续
</button>

<button onclick="stopSpeech()">
停止
</button>

<button onclick="copyText()">
复制
</button>

<button onclick="formatText()">
整理
</button>

<button onclick="clearText()">
清空
</button>


<select id="rate">

<option value="0.7">
0.7倍速
</option>

<option value="1" selected>
1倍速
</option>

<option value="1.2">
1.2倍速
</option>

<option value="1.5">
1.5倍速
</option>

</select>


</div>



<script>


let speaking=false;

let paused=false;



// 复制

function copyText(){

    navigator.clipboard.writeText(
        document.getElementById("editor").value
    );

}



// 整理文字

function formatText(){

    let editor=
    document.getElementById("editor");


    editor.value=
    editor.value.replace(
        /[\s\u00A0\u3000]+/g,
        ""
    );

}



// 清空

function clearText(){

    stopSpeech();

    document.getElementById("editor")
    .value="";


    updateStatus("准备就绪");

}




// 获取Edge中文声音

function getChineseVoice(){


    let voices=
    speechSynthesis.getVoices();



    return voices.find(v=>

        v.name.includes("Xiaoxiao")||

        v.name.includes("晓晓")||

        v.name.includes("Yunxi")||

        v.name.includes("云希")

    )

    ||

    voices.find(v=>

        v.lang==="zh-CN"

    );


}




// 开始朗读

function speakText(){


    let text=
    document.getElementById("editor")
    .value.trim();


    if(!text){

        updateStatus("没有内容");

        return;

    }



    speechSynthesis.cancel();



    let utterance=
    new SpeechSynthesisUtterance(text);



    utterance.lang="zh-CN";


    utterance.rate=
    Number(
        document.getElementById("rate")
        .value
    );


    utterance.pitch=1;



    let voice=
    getChineseVoice();



    if(voice){

        utterance.voice=voice;

    }



    utterance.onstart=function(){

        speaking=true;

        paused=false;

        updateStatus("正在朗读");

    };



    utterance.onend=function(){

        speaking=false;

        paused=false;

        updateStatus("朗读完成");

    };



    utterance.onerror=function(){

        speaking=false;

        updateStatus("朗读错误");

    };



    speechSynthesis.speak(
        utterance
    );

}




// 暂停 / 继续

function pauseResume(){


    if(!speaking)
        return;



    if(paused){


        speechSynthesis.resume();

        paused=false;

        updateStatus("继续朗读");


    }

    else{


        speechSynthesis.pause();

        paused=true;

        updateStatus("已暂停");


    }


}




// 停止

function stopSpeech(){


    speechSynthesis.cancel();


    speaking=false;

    paused=false;


    updateStatus("已停止");


}




function updateStatus(text){

    document.getElementById("status")
    .innerText=text;

}




speechSynthesis.onvoiceschanged=function(){

    speechSynthesis.getVoices();

};


speechSynthesis.getVoices();


</script>


</body>

</html>
